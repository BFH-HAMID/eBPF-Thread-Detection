name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Userspace logic (rules engine, decoder, enrichment, features) with the
  # eBPF build skipped: fast feedback, no nightly/bpf-linker needed.
  test:
    runs-on: ubuntu-latest
    env:
      AYA_BUILD_SKIP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (agent + common)
        run: cargo test --workspace --exclude sentinel-ebpf

      - name: Rule files parse
        run: |
          cargo build -p sentinel
          ./target/debug/sentinel --rules rules/ --dry-run

  lint:
    runs-on: ubuntu-latest
    env:
      AYA_BUILD_SKIP: "1"
    steps:
      - uses: actions/checkout@v7

      # rustfmt.toml uses unstable options (group_imports, ...).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --exclude sentinel-ebpf --all-targets -- -D warnings

  # Full build including the eBPF object (nightly + bpf-linker via aya-build).
  ebpf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker

      - name: Build agent (builds sentinel-ebpf through build.rs)
        run: cargo build --release -p sentinel

      - name: Python pipeline syntax
        run: python3 -m py_compile ml/datasets/collect.py ml/train/train_iforest.py ml/train/train_autoencoder.py ml/export/export_onnx.py

  check:
    if: always()
    needs: [test, lint, ebpf-build]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
